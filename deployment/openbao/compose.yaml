services:
  openbao:
    image: ${OPENBAO_IMAGE:?Set an approved OpenBao image pinned by digest}
    command: server -config=/bao/config/server.hcl
    restart: unless-stopped
    environment:
      BAO_ADDR: ${BAO_ADDR:?Set the HTTPS vault address}
      BAO_CACERT: /bao/tls/ca.crt
    dns:
      - ${AD_DNS_IP:?Set a DNS server resolving the AD domain and registry names}
    ports:
      - "${BIND_IP:?Set the vault host interface IP}:8200:8200"
    volumes:
      - ./server.hcl:/bao/config/server.hcl:ro
      - ./tls:/bao/tls:ro
      - bao-data:/bao/data
      - bao-plugins:/bao/plugins
      - bao-audit:/bao/audit
    security_opt:
      - no-new-privileges:true
volumes:
  bao-data:
  bao-plugins:
  bao-audit:
